<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Book - Nicolas Rohart</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://nicolasrohart.com/book.html">

<!-- Police auto-hebergee (assets/fonts/) : aucune requete vers un tiers, donc aucune
     transmission d'adresse IP. Meme choix que index.html. -->
<style>
  @font-face{
    font-family:'IBM Plex Mono'; font-style:normal; font-display:swap; font-weight:400;
    src:url('assets/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'IBM Plex Mono'; font-style:normal; font-display:swap; font-weight:400;
    src:url('assets/fonts/ibm-plex-mono-latin-ext-400-normal.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  @font-face{
    font-family:'IBM Plex Mono'; font-style:normal; font-display:swap; font-weight:500;
    src:url('assets/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'IBM Plex Mono'; font-style:normal; font-display:swap; font-weight:500;
    src:url('assets/fonts/ibm-plex-mono-latin-ext-500-normal.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  :root{
    --ink:#211D17;
    --paper:#F6F3EC;
    --oak:#A9784A;
    --oak-soft:#C89A69;
    --line:rgba(246,243,236,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#141210;
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  .viewer{
    position:relative;
    height:100dvh;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .frame{
    position:relative;
    max-width:92vw;
    max-height:82dvh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .frame img{
    max-width:92vw;
    max-height:82dvh;
    width:auto;
    height:auto;
    display:block;
    object-fit:contain;
    box-shadow:0 20px 60px rgba(0,0,0,0.55);
    opacity:0;
    cursor:zoom-in;
    transition:opacity 0.35s ease;
  }
  .frame img.loaded{opacity:1;}

  .frame.zoomed{
    max-width:100vw;
    max-height:100dvh;
    width:100vw;
    height:100dvh;
    align-items:flex-start;
    justify-content:flex-start;
    overflow:auto;
  }
  .frame.zoomed img{
    max-width:none;
    max-height:none;
    cursor:zoom-out;
  }

  /* top bar */
  .topbar{
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px;
    z-index:20;
    background:linear-gradient(rgba(10,9,8,0.55), transparent);
  }
  .topbar .brand{
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--paper); opacity:0.75;
  }
  .counter{
    font-size:11px; letter-spacing:0.06em; color:var(--paper); opacity:0.75;
  }
  .close-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(20,18,16,0.5);
    color:var(--paper);
    font-size:16px;
    text-decoration:none;
    transition:background 0.15s ease, transform 0.15s ease;
  }
  .close-btn:hover{ background:var(--oak); transform:scale(1.06); }

  /* nav zones */
  .nav-zone{
    position:absolute; top:0; bottom:0; width:18%;
    display:flex; align-items:center;
    cursor:pointer;
    z-index:10;
    user-select:none;
  }
  .nav-zone.prev{ left:0; justify-content:flex-start; }
  .nav-zone.next{ right:0; justify-content:flex-end; }

  .nav-arrow{
    width:40px; height:40px;
    margin:0 14px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(20,18,16,0.4);
    color:var(--paper);
    font-size:16px;
    opacity:0.55;
    transition:opacity 0.15s ease, background 0.15s ease;
  }
  .nav-zone:hover .nav-arrow{ opacity:1; background:rgba(169,120,74,0.55); }

  /* bottom caption / progress */
  .hint .legal-link{color:inherit; text-decoration:underline; text-underline-offset:0.2em;}
  .bottombar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:16px 22px 20px;
    z-index:20;
    background:linear-gradient(transparent, rgba(10,9,8,0.55));
  }
  .progress{
    width:min(420px, 70vw);
    height:2px;
    background:rgba(246,243,236,0.18);
    border-radius:2px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--oak-soft);
    width:0%;
    transition:width 0.25s ease;
  }
  .hint{
    font-size:10px; letter-spacing:0.05em; color:var(--paper); opacity:0.45;
  }

  @media (max-width:640px){
    .hint{display:none;}
    .nav-zone{width:26%;}
  }
</style>
</head>
<body>

<div class="viewer" id="viewer">
  <div class="topbar">
    <a href="index.html" id="closeBtn" class="close-btn" aria-label="Close and return to site">&times;</a>
    <span class="brand">Nicolas Rohart</span>
    <span class="counter" id="counter">1 / 58</span>
  </div>

  <div class="nav-zone prev" id="prevZone" aria-label="Previous photo">
    <span class="nav-arrow">&larr;</span>
  </div>
  <div class="nav-zone next" id="nextZone" aria-label="Next photo">
    <span class="nav-arrow">&rarr;</span>
  </div>

  <div class="frame">
    <img id="mainImg" alt="">
  </div>

  <div class="bottombar">
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <span class="hint">&larr; &rarr; to navigate &middot; Esc to close &middot; swipe on mobile &middot; <a class="legal-link" href="index.html#mentions">Mentions légales</a></span>
  </div>
</div>

<script>
  const TOTAL = 58;
  const BASE = 'assets/book/';
  let current = 1;

  // read #n from URL if present
  const hash = parseInt(location.hash.replace('#',''), 10);
  if (hash >= 1 && hash <= TOTAL) current = hash;

  const img = document.getElementById('mainImg');
  const frame = document.querySelector('.frame');
  const counter = document.getElementById('counter');
  const progressFill = document.getElementById('progressFill');
  const prevZone = document.getElementById('prevZone');
  const nextZone = document.getElementById('nextZone');

  function pad(n){ return String(n).padStart(2,'0'); }

  function preload(n){
    if(n < 1 || n > TOTAL) return;
    const pre = new Image();
    pre.src = BASE + pad(n) + '.webp';
  }

  function show(n, push){
    frame.classList.remove('zoomed');
    current = ((n - 1 + TOTAL) % TOTAL) + 1;
    img.classList.remove('loaded');
    const src = BASE + pad(current) + '.webp';
    img.onload = () => img.classList.add('loaded');
    img.src = src;
    img.alt = 'Nicolas Rohart - photo ' + current + ' of ' + TOTAL;
    counter.textContent = current + ' / ' + TOTAL;
    progressFill.style.width = (current / TOTAL * 100) + '%';
    if (history.replaceState) history.replaceState(null, '', '#' + current);
    preload(current + 1);
    preload(current - 1);
  }

  function next(){ show(current + 1); }
  function prev(){ show(current - 1); }

  prevZone.addEventListener('click', prev);
  nextZone.addEventListener('click', next);

  img.addEventListener('click', () => {
    frame.classList.toggle('zoomed');
  });

  function goBack(){
    if (history.length > 1){
      history.back();
    } else {
      window.location.href = 'index.html';
    }
  }

  document.getElementById('closeBtn').addEventListener('click', function(e){
    if (history.length > 1){
      e.preventDefault();
      goBack();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'Escape') goBack();
  });

  // swipe support
  let touchStartX = null;
  document.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].clientX;
  }, {passive:true});
  document.addEventListener('touchend', (e) => {
    if (touchStartX === null || frame.classList.contains('zoomed')) { touchStartX = null; return; }
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40){
      if (dx < 0) next(); else prev();
    }
    touchStartX = null;
  }, {passive:true});

  show(current);
</script>

</body>
</html>
